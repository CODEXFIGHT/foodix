; RestaurOS — afinación de PHP para el backend (shared hosting).
; .user.ini lo lee PHP-FPM por directorio. Si el proveedor fija algún valor a
; nivel sistema, esa línea se ignora (inofensivo).

; OPcache: cachea el bytecode compilado → menos CPU por petición.
opcache.enable=1
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.revalidate_freq=60
opcache.validate_timestamps=1

; Caché de rutas de archivos resueltas (require_once de las rutas/configs).
realpath_cache_size=4096k
realpath_cache_ttl=600

; Sin límites de salida innecesarios para respuestas JSON.
zlib.output_compression=Off
